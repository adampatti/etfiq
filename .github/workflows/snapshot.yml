name: Daily snapshot
on:
  schedule:
    - cron: '30 23 * * 1-5'   # 7:30pm New York in daylight time: issuer pages and Tiingo end-of-day are in
    - cron: '30 3 * * 2-6'    # 11:30pm New York: second pass so a late feed still lands before the morning
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: snapshot
  cancel-in-progress: false
env:
  TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ETFIQ_CONTACT: ${{ secrets.ETFIQ_CONTACT }}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Buffer desk from issuer pages
        id: snapshot
        continue-on-error: true
        run: python pipeline/snapshot.py
      - name: Income desk prices and returns
        id: income
        if: ${{ env.TIINGO_TOKEN != '' }}
        continue-on-error: true
        run: python pipeline/income.py
      - name: Payout calendar
        id: payouts
        if: ${{ env.TIINGO_TOKEN != '' }}
        continue-on-error: true
        run: python pipeline/payouts.py
      - name: Income desk sources of distributions (19a-1)
        id: sources
        continue-on-error: true
        run: python pipeline/sources.py
      - name: Expense ratios from prospectus XBRL (weekly)
        id: fees
        continue-on-error: true
        run: python pipeline/fees.py
      - name: Themes desk holdings and returns
        id: themes
        if: ${{ env.TIINGO_TOKEN != '' }}
        continue-on-error: true
        run: python pipeline/thematic.py
      - name: What changed (computed lines)
        continue-on-error: true
        run: python pipeline/insights.py
      - name: Research pieces (computed tables)
        continue-on-error: true
        run: python pipeline/research.py
      - name: Research narratives (Claude, checked against the tables)
        id: draft
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true
        run: python pipeline/draft.py && python pipeline/research.py
      - name: Build the page
        run: python pipeline/build_site.py
      - name: Static pages for crawlers
        run: python pipeline/prerender.py
      - name: No em dashes anywhere on the site
        run: |
          if grep -rl $'\xe2\x80\x94' site --include='*.html' --include='*.txt' --include='*.json' --include='*.xml'; then echo "em dash found"; exit 1; fi
      - name: Commit the snapshot
        run: |
          git config user.name "etfiq-snapshot"
          git config user.email "snapshot@etfiq.com"
          DATA="data/snapshots data/income_universe.json data/fees.json data/research site/data site/research site/funds site/buffer site/income site/themes site/sitemap.xml site/robots.txt site/llms.txt pipeline/cache/innovator_pages.json"
          git add $DATA site/index.html
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          tar cf /tmp/snapshot-data.tar $DATA
          git commit -m "Snapshot $(date -u +%F)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "main moved while this run was working; rebuilding the page on the newest code"
            git fetch origin main
            git reset --hard origin/main
            tar xf /tmp/snapshot-data.tar
            python pipeline/build_site.py
            git add $DATA site/index.html
            git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          done
          exit 1
      # A push made with GITHUB_TOKEN does not trigger other workflows, so deploy from here as well.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      - name: Tell search engines what changed (IndexNow)
        continue-on-error: true
        run: python pipeline/indexnow.py
      - name: Report
        if: always()
        run: |
          echo "buffer desk: ${{ steps.snapshot.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "income desk: ${{ steps.income.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "payout calendar: ${{ steps.payouts.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "themes desk: ${{ steps.themes.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "cash sources: ${{ steps.sources.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "expense ratios: ${{ steps.fees.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "research narratives: ${{ steps.draft.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "buffer as of: $(python -c 'import json;print(json.load(open("site/data/meta.json")).get("asOf"))')" >> $GITHUB_STEP_SUMMARY
          echo "income as of: $(python -c 'import json;print(json.load(open("site/data/income_meta.json")).get("asOf"))')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.snapshot.outcome }}" = "failure" ] || [ "${{ steps.income.outcome }}" = "failure" ] || [ "${{ steps.payouts.outcome }}" = "failure" ] || [ "${{ steps.themes.outcome }}" = "failure" ]; then echo "a data step failed; the site deployed with the last good data for that desk"; exit 1; fi
